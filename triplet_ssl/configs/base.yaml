# Shared defaults. Each phaseN.yaml sets `base: base.yaml` and overrides a few keys.
phase: 1

model:
  patch_size: 16
  img_size: 224
  cls_out_dim: 1024
  patch_out_dim: 1024
  head_hidden: 1024
  head_bottleneck: 128
  head_nlayers: 2

# Directional detector deployed with the EMA teacher backbone.  It treats
# target as a distinct role while remaining invariant to ref1/ref2 swapping.
# Phase 3 enables it, because the full synthetic presence truth table is then
# available for supervision.
fusion_head:
  enable: false
  hidden_dim: 128
  dropout: 0.1
  prior_prob: 0.01
  loss_weight: 0.5
  warmup_steps: 10
  ema_momentum: 0.9
  background_negative_frac: 0.25

# Initialise from DINOv3 pretrained weights (mimic until real weights are placed).
checkpoint: checkpoints/dinov3_vitb16_mimic.pth

data:
  root: data/sem_triplet
  train_split: train
  eval_split: val
  num_workers: 0             # dataloader workers(GPU 訓練時建議 2-4,撒點/對位不卡 GPU)
  register: false            # phase-correlation die-to-die pre-registration
  # uint16 acquisition mapping before DINO normalization. For right-aligned
  # 12-bit TIFF set white_level=4095; float32 0..255 bypasses these fields.
  uint16_black_level: 0
  uint16_white_level: 65535
  crop_scale: [0.4, 1.0]
  flip_prob: 0.5             # horizontal only; vertical flip is forbidden in code
  brightness_delta: 15
  contrast_range: [0.9, 1.1]
  gamma_range: [0.9, 1.1]
  blur_prob: 0.0

loss:
  # No unconditional ref1<->ref2 pull: a PSF present in only one reference is
  # a nuisance, and must remain visible for the triplet comparison.
  weights: {traditional: 0.5, target2ref: 0.5}
  student_temp: 0.1
  teacher_temp: 0.04           # warmup start
  teacher_temp_end: 0.07       # standard DINO: linear 0.04 -> 0.07, then constant
  teacher_temp_warmup_frac: 0.3
  center_momentum: 0.9
  cls_weight: 1.0
  topk_exempt: {enable: false, pct: 0.02}   # target<->ref only

oversample: {enable: false, defect_frac: 0.1}   # 5-20% defect triplets per batch
synth_defect:
  enable: false
  n_events: [3, 8]             # nuisance PSF points per triplet, random presence combos
  defect_prob: 0.5             # chance of ONE true (target-only) defect on normal triplets
  missing_frac: 0.0            # only (target,ref1,ref2)=(1,0,0) is a defect
  lambda: 0.1                  # bounded backbone-token margin loss weight
  margin: 0.5                  # L2 distance after token L2 normalization (range 0..2)
  psf_sigma: [1.1, 1.7]        # footprint (>20% peak) ~ 3.6*sigma = 4.0-6.1 px
  psf_amplitude: [15, 80]      # gray levels; polarity is local-background-aware

optim:
  amp: false                 # bf16 autocast(H100/H200 建議 true;CPU 自動忽略)
  backbone_lr: 1.0e-5        # small: continued pretraining (domain adaptation)
  head_lr: 1.0e-3            # heads train normally
  # 大 global batch(bs × GPU 數)時依線性法則手動放大 LR:
  # lr_eff = lr × global_batch / 你調參時的 batch
  layerwise_decay: 0.9
  weight_decay: 0.04
  momentum_teacher: 0.996        # cosine-ramped to momentum_teacher_final
  momentum_teacher_final: 1.0
  batch_size: 8
  num_steps: 60
  warmup_steps: 10
  grad_clip: 3.0

eval:
  overlap_thresh: 0          # patch is "defect" on any GT overlap
  n_heatmaps: 10
  residual_mode: mean        # mean = 兩 ref 平均(refs 乾淨時噪聲最低)
                             # min  = double detection(單邊 ref 髒不會誤報)
  # Native TIFF point-label validation. Enable with --val-root or set a path.
  # Each filename stem must end in exactly one #x,y; coordinates are target pixels.
  labeled_tiff_root: null
  every_steps: 10
  top_k: 5
  match_radius_px: 15.0      # strict Euclidean distance: distance < 15px
  coordinate_base: 0         # set 1 only if acquisition labels are one-based
  tiff_chunk: 1              # low-VRAM default; increase only after measuring headroom

separability_gate: {min_auroc_delta: 0.0}   # must beat the phase-0 baseline
seed: 0

# Rank 0 runs the complete labeled validation directory while other DDP ranks
# wait at a barrier; allow long optical validation sets without a false timeout.
distributed: {timeout_minutes: 120}
