# TIFF 3 通道模式範例:一個 .tif = 一個 pattern 位置,
# sample 0=target, 1=ref1, 2=ref2。支援 float32/uint8/uint16；單頁 YXS(HWC)、
# 單頁 SYX(CHW/PlanarConfig SEPARATE)與 3-page 都會由 TIFF metadata 嚴格判定。
# 流程:原生解析度 128x128 視窗裁切(不 resize)→ 裁切後 on-the-fly 貼 PSF 事件。
base: base.yaml
phase: 3
data:
  format: tiff3
  root: data/tiff_train            # 放 .tif/.tiff 的目錄
  # 不用 224px SEM folder eval 當 optical 128px-tile deployment gate；兩者 token
  # context 不同。無標註 TIFF 會跳過 GT eval，部署前改用 infer.py --calib。
  crop_size: 128
  cls_local_size: 64   # student 的 CLS local 視圖(原生尺度、不 resize;16 的倍數)。null = 關閉
loss:
  topk_exempt: {enable: true, pct: 0.02}   # 128px -> 64 patches, 2% = 1 patch
oversample: {enable: false}        # tiff 模式沒有真缺陷旗標,關閉
# target-only positives 與 nuisance 都在 crop 內均勻落點，避免位置 shortcut。
# Fusion 使用完整 128px native view，不需要把 defect 限制在 CLS local crop 中。
synth_defect: {enable: true, n_events: [2, 5], defect_prob: 0.5, lambda: 0.1}
fusion_head: {enable: true}
# 啟用人工座標 validation 時傳入 --val-root <test TIFF 目錄>。每張檔名需以
# #x,y 結尾；每 10 steps 用正式 tile/halo fusion inference 跑完整目錄並更新 best。
